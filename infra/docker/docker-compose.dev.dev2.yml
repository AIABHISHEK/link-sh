services:
  workspace-install:
    image: oven/bun:1.3.6
    container_name: link_workspace_install
    working_dir: /app
    command:
      - sh
      - -lc
      - |
        sh infra/docker/workspace-install.sh
    volumes:
      - ../..:/app
      - link_node_modules:/app/node_modules
      - link_bun_cache:/root/.bun/install/cache
    restart: "no"

  public-redirect:
    image: oven/bun:1.3.6
    container_name: link_public_redirect_dev
    working_dir: /app
    command:
      - sh
      - -lc
      - |
        bun --watch run services/public-redirect/src/server.ts
    volumes:
      - ../..:/app
      - link_node_modules:/app/node_modules
      - link_bun_cache:/root/.bun/install/cache
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PORT: 3000
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/links
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    depends_on:
      workspace-install:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "3000:3000"
    init: true
    stdin_open: true
    tty: true

  dashboard-api:
    image: oven/bun:1.3.6
    container_name: link_dashboard_api_dev
    working_dir: /app
    command:
      - sh
      - -lc
      - |
        until bun run migrate:up; do
          echo "Waiting for Postgres and retrying migrations...";
          sleep 2;
        done &&
        bun --watch run services/dashboard-api/src/server.ts
    volumes:
      - ../..:/app
      - link_node_modules:/app/node_modules
      - link_bun_cache:/root/.bun/install/cache
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      PORT: 3002
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/links
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Intentionally unset in dev: there is no gateway locally, so provenance
      # checks are skipped and x-user-id can be set by hand. The production
      # stack requires this secret and refuses to start without it.
    depends_on:
      workspace-install:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
    # Published for local development convenience only; see the note above.
    ports:
      - "3002:3002"
    init: true
    stdin_open: true
    tty: true

  auth-service:
    image: oven/bun:1.3.6
    container_name: link_auth_service_dev
    working_dir: /app
    command:
      - sh
      - -lc
      - |
        bun --watch run services/auth-service/src/server.ts
    volumes:
      - ../..:/app
      - link_node_modules:/app/node_modules
      - link_bun_cache:/root/.bun/install/cache
    environment:
      # Dev-token stub (see token-verifier.ts): accepts any "dev:<userId>"
      # bearer token. There is no gateway or Traefik in this dev stack, so hit
      # this service directly if you want to exercise /verify by hand.
      NODE_ENV: development
      LOG_LEVEL: info
      PORT: 3003
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      workspace-install:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    ports:
      - "3003:3003"
    init: true
    stdin_open: true
    tty: true

  aggregation-worker:
    image: oven/bun:1.3.6
    container_name: link_aggregation_worker_dev
    working_dir: /app
    command:
      - sh
      - -lc
      - |
        bun --watch run services/aggregation-worker/src/index.ts
    volumes:
      - ../..:/app
      - link_node_modules:/app/node_modules
      - link_bun_cache:/root/.bun/install/cache
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/links
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      workspace-install:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    init: true
    stdin_open: true
    tty: true

volumes:
  link_node_modules:
  link_bun_cache:
