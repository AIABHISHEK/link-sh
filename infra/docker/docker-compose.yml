services:
  gateway:
    image: traefik:v3.2
    container_name: link_gateway
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    environment:
      # Traefik's own {{ env "..." }} template call reads this at runtime, to
      # inject it as X-Gateway-Secret on the way to dashboard-api. This is a
      # separate mechanism from the ${...:?...} compose-file interpolation
      # below on dashboard-api/auth-service — both must see the same value.
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?GATEWAY_SHARED_SECRET must be set for the production stack}
    # Host port is 8080 so the stack runs without elevated privileges (binding
    # :80 needs them on Windows). Traefik still listens on :80 inside the
    # container. Change the left side to 80 when deploying somewhere that can
    # bind it, and update BASE_URL below to match.
    ports:
      - "8080:80"
    depends_on:
      public-redirect:
        condition: service_started
      dashboard-api:
        condition: service_started
      auth-service:
        condition: service_started
    restart: unless-stopped

  auth-service:
    build:
      context: ../..
      dockerfile: infra/docker/auth-service.Dockerfile
    container_name: link_auth_service
    # Not reachable from the host; only the gateway's ForwardAuth calls this,
    # in-network as http://auth-service:3003.
    expose:
      - "3003"
    environment:
      # STILL THE PHASE B DEV-TOKEN STUB (see token-verifier.ts): it accepts
      # any "dev:<userId>" bearer token as proof of identity. NODE_ENV is
      # deliberately NOT production here, because assertVerifierUsable()
      # refuses to boot in production while the stub is in use. Phase C
      # replaces the stub with real JWKS verification; flipping this to
      # production is how that cutover gets enforced, not skipped.
      NODE_ENV: development
      LOG_LEVEL: info
      PORT: 3003
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      otel-collector:
        condition: service_started
    restart: unless-stopped

  public-redirect:
    build:
      context: ../..
      dockerfile: infra/docker/redirect.Dockerfile
    container_name: link_public_redirect
    # Not published: reached only through the gateway, which is the single
    # public entry point now that one exists.
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 3000
      # The gateway is the public address short URLs must resolve through, so
      # this must match the gateway's published host port above.
      BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/links
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped

  dashboard-api:
    build:
      context: ../..
      dockerfile: infra/docker/dashboard-api.Dockerfile
    container_name: link_dashboard_api
    # Deliberately no published port: this service trusts the gateway's
    # x-user-id assertion, so it must only be reachable in-network as
    # http://dashboard-api:3002. Publishing a host port here would let any
    # local client impersonate any user. Expose it through the gateway instead.
    expose:
      - "3002"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 3002
      # Used to build shortUrl in API responses; must match the gateway's
      # published host port above.
      BASE_URL: http://localhost:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/links
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Must match the value the gateway sends. Compose fails fast if unset.
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:?GATEWAY_SHARED_SECRET must be set for the production stack}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: unless-stopped

  aggregation-worker:
    build:
      context: ../..
      dockerfile: infra/docker/aggregator.Dockerfile
    container_name: link_aggregation_worker
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/links
      KAFKA_BROKERS: kafka:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: link_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: links
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: link_redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    container_name: link_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CLUSTER_ID: 9HhWxSvGgNSM5c5FOI2XbC

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: link_kafka_init
    depends_on:
      - kafka
    command:
      - bash
      - -lc
      - |
        echo "Waiting for Kafka broker..." &&
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 2;
        done &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic link.clicks --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe --topic link.clicks
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: link_otel_collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4318:4318"
      - "4317:4317"
      - "9464:9464"

  prometheus:
    image: prom/prometheus:latest
    container_name: link_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  loki:
    image: grafana/loki:latest
    container_name: link_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:2.10.1
    container_name: link_tempo
    command: ["-config.file=/etc/tempo.yaml", "-target=all"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  grafana:
    image: grafana/grafana:latest
    container_name: link_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  pg_data:
  tempo-data:
